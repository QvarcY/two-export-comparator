name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please use synthetic data only — never attach confidential exports.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Load synthetic File A...
        3. Load synthetic File B...
        4. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / version
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: fixture
    attributes:
      label: Minimal synthetic fixture
      description: Paste the smallest non-sensitive example that reproduces the problem.
